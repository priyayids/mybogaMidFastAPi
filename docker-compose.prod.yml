# Nuveq Access Control Middle Service - production compose.
# Deploy target: dev.app-cube.tech (VPS 187.77.126.196)
#
# The API port binds to LOOPBACK ONLY. nginx is the sole public entry point,
# so the container is never directly reachable from the internet.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mybogamidfastapi-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: mybogamidfastapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myboga}
      POSTGRES_USER: ${POSTGRES_USER:-myboga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myboga} -d ${POSTGRES_DB:-myboga}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
